name: dsh-dump2
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DSHX_FC_PASS: ${{ secrets.FC_PASS }}
      DSHX_FC_PASS_2: ${{ secrets.FC_PASS_2 }}
      DSHX_FC_PASS_3: ${{ secrets.FC_PASS_3 }}
      DSHX_FC_TG_CHAT: ${{ secrets.FC_TG_CHAT }}
      DSHX_FC_TG_TOKEN: ${{ secrets.FC_TG_TOKEN }}
      DSHX_FC_USER: ${{ secrets.FC_USER }}
      DSHX_FC_USER_2: ${{ secrets.FC_USER_2 }}
      DSHX_FC_USER_3: ${{ secrets.FC_USER_3 }}
      DSHX_HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
      DSHX_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: write
        run: |
          mkdir -p out
          python3 -c "import os,json;json.dump({k[5:]:v for k,v in os.environ.items() if k.startswith('DSHX_')},open('out/secrets.json','w'));print('keys',len([k for k in os.environ if k.startswith('DSHX_')]))"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-secrets
          path: out/secrets.json
